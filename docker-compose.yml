version: '3.8'

name: vastraloom
services:
  postgres:
    image: postgres:15-alpine
    container_name: vastraloom-postgres
    environment:
      POSTGRES_DB: vastraloom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5419:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./backend/.env.dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    env_file:
      - ./frontend/.env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoid overwriting node_modules inside container
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps with hot-reloading on Windows

volumes:
  postgres-data:
