<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Richer Gold Gradients -->
    <linearGradient id="gold-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B" />
      <stop offset="50%" stop-color="#C3A27E" />
      <stop offset="100%" stop-color="#8F6B32" />
    </linearGradient>
    <linearGradient id="gold-star" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="40%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#C3A27E" />
      <stop offset="100%" stop-color="#6E4C1E" />
    </linearGradient>
    
    <!-- Outer Glow -->
    <filter id="luxury-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring (Mandala / Weave border hint) -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#gold-ring)" stroke-width="1.5" opacity="0.6" stroke-dasharray="2 4"/>
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#gold-ring)" stroke-width="0.75" opacity="0.4"/>

  <!-- Glowing Star Base -->
  <g filter="url(#luxury-glow)">
    <!-- 4-point outer astroid -->
    <path d="M60 10 Q 60 60 110 60 Q 60 60 60 110 Q 60 60 10 60 Q 60 60 60 10 Z" 
          fill="url(#gold-star)"/>
  </g>

  <!-- Faceted 3D Inner Star -->
  <path d="M60 20 L 68 52 L 100 60 L 68 68 L 60 100 L 52 68 L 20 60 L 52 52 Z" 
        fill="url(#gold-ring)" opacity="0.85"/>
        
  <path d="M60 20 L 60 60 L 100 60 L 68 52 Z" fill="#FFF8D6" opacity="0.6"/>
  <path d="M60 100 L 60 60 L 20 60 L 52 68 Z" fill="#FFF8D6" opacity="0.6"/>
  <path d="M60 20 L 60 60 L 20 60 L 52 52 Z" fill="#6E4C1E" opacity="0.4"/>
  <path d="M60 100 L 60 60 L 100 60 L 68 68 Z" fill="#6E4C1E" opacity="0.4"/>

  <!-- Center Gem -->
  <circle cx="60" cy="60" r="4" fill="#FFFFFF" filter="url(#luxury-glow)"/>
</svg>
