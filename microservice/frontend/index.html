<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khandua Looms | Odisha Handloom & Khadua Sarees</title>
    <meta name="description" content="Explore Khandua Looms, your destination for Odisha-inspired handloom sarees, traditional Khadua styles, Sambalpuri Ikat, Bomkai designs, and timeless Indian elegance." />
    <meta name="keywords" content="Khandua Looms, Odisha Handloom, Khadua Silk Sarees, Sambalpuri Ikat, Bomkai Sarees, Wedding Sarees, Indian Handloom" />
    
    <!-- OpenGraph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khandua Looms | Odisha Handloom & Khadua Sarees" />
    <meta property="og:description" content="Woven in Tradition. Wrapped in Elegance. Explore authentic Odisha handloom sarees, traditional Khadua silk, Sambalpuri Ikat, and Bomkai weaves." />
    <meta property="og:image" content="/images/products/p1/front.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Anti-Flash Theme Init Script (Strictly White/Light for first-time visitors) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('khandualoom_theme_preference');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary font-sans antialiased selection:bg-brand-gold/30 selection:text-brand-purple">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
