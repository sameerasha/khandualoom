version: '3.8'

name: vastraloom-micro

services:
  # ==========================================
  # 1. PostgreSQL 16 with pgvector Extension
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vastraloom-micro-postgres
    ports:
      - "5419:5432"
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vastraloom_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vastraloom_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 2. Redis 7 Cache & Session Store
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: vastraloom-micro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 3. Apache Kafka (KRaft Mode - No Zookeeper)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vastraloom-micro-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 4. Kafka UI Web Console
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vastraloom-micro-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vastraloom-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 5. Auth Microservice (:8081)
  # ==========================================
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: vastraloom-micro-auth
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/vastraloom_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 6. Product Microservice (:8082)
  # ==========================================
  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: vastraloom-micro-product
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/vastraloom_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 7. Order Microservice (:8083)
  # ==========================================
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: vastraloom-micro-order
    ports:
      - "8083:8083"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/vastraloom_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 8. Notification Microservice (:8084)
  # ==========================================
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: vastraloom-micro-notification
    ports:
      - "8084:8084"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/vastraloom_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 9. Spring Cloud API Gateway (:8080)
  # ==========================================
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: vastraloom-micro-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
    depends_on:
      - auth-service
      - product-service
      - order-service
      - notification-service
    networks:
      - vastraloom-micro-net

  # ==========================================
  # 10. React TypeScript Luxury Storefront (:3000 / :5174)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vastraloom-micro-frontend
    ports:
      - "3000:80"
      - "5174:80"
    depends_on:
      - api-gateway
    networks:
      - vastraloom-micro-net

volumes:
  postgres-data:
  redis-data:
  kafka-data:

networks:
  vastraloom-micro-net:
    name: vastraloom-micro-net
    driver: bridge
