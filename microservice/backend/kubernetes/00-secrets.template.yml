apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: khandualoom
  labels:
    app.kubernetes.io/name: app-secrets
    app.kubernetes.io/part-of: khandualoom
type: Opaque
stringData:
  # ===================================================================
  # 1. Database Parameters & Credentials
  # ===================================================================
  POSTGRES_DB: "khandualoom_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  DB_URL: "jdbc:postgresql://postgres:5432/khandualoom_db"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  DB_DRIVER: "org.postgresql.Driver"
  DB_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"

  # ===================================================================
  # 2. Caching and Event-Driven Mesh Coordinates
  # ===================================================================
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

  # ===================================================================
  # 3. Inter-Service Routing
  # ===================================================================
  AUTH_SERVICE_URL: "http://auth-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8084"

  # ===================================================================
  # 4. Observability & Distributed Tracing
  # ===================================================================
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
  TRACING_SAMPLING_PROBABILITY: "1.0"
  ENVIRONMENT: "development"

  # ===================================================================
  # 5. CORS Allowed Origins
  # ===================================================================
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:30080"

  # ===================================================================
  # 6. Security Signature Secret (HMAC-SHA256, minimum 256-bit key)
  # ===================================================================
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_KEY_MIN_256_BITS_PLACEHOLDER_0123456789ABCDEF"

  # ===================================================================
  # 7. Email Gateway (SMTP / Brevo) Credentials
  # ===================================================================
  MAIL_HOST: "smtp-relay.brevo.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: "CHANGE_ME_SMTP_USERNAME"
  MAIL_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"
  MAIL_FROM: "concierge@khandualoom.com"

  # ===================================================================
  # 8. OAuth 2.0 Social Identity Provider Credentials
  # ===================================================================
  GOOGLE_CLIENT_ID: "CHANGE_ME_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME_GOOGLE_CLIENT_SECRET"
  FACEBOOK_CLIENT_ID: "CHANGE_ME_FACEBOOK_CLIENT_ID"
  FACEBOOK_CLIENT_SECRET: "CHANGE_ME_FACEBOOK_CLIENT_SECRET"
  INSTAGRAM_CLIENT_ID: "CHANGE_ME_INSTAGRAM_CLIENT_ID"
  INSTAGRAM_CLIENT_SECRET: "CHANGE_ME_INSTAGRAM_CLIENT_SECRET"

  # ===================================================================
  # 9. Payment Gateway (Razorpay) Credentials
  # ===================================================================
  RAZORPAY_KEY_ID: "CHANGE_ME_RAZORPAY_KEY_ID"
  RAZORPAY_KEY_SECRET: "CHANGE_ME_RAZORPAY_KEY_SECRET"

  # ===================================================================
  # 10. Observability Admin Credentials
  # ===================================================================
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_GRAFANA_PASSWORD"
