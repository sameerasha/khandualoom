apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: khandualoom-micro
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: khandualoom-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
