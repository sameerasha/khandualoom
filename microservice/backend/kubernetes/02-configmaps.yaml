apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: khandualoom-micro
  labels:
    app.kubernetes.io/name: app-config
    app.kubernetes.io/part-of: khandualoom-platform
data:
  # Database Parameters
  POSTGRES_DB: "khandualoom_db"
  DB_URL: "jdbc:postgresql://postgres:5432/khandualoom_db"
  DB_DRIVER: "org.postgresql.Driver"
  DB_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"

  # Caching and Event-Driven Mesh
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

  # Inter-Service Routing
  AUTH_SERVICE_URL: "http://auth-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8084"

  # Observability & Distributed Tracing
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
  TRACING_SAMPLING_PROBABILITY: "1.0"
  ENVIRONMENT: "production"

  # CORS Allowed Origins
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:30080"

  # Email Gateway
  MAIL_HOST: "smtp-relay.brevo.com"
  MAIL_PORT: "587"
  MAIL_FROM: "asha.rabinarayan@gmail.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: khandualoom-micro
  labels:
    app.kubernetes.io/name: observability-config
    app.kubernetes.io/part-of: khandualoom-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: 'api-gateway'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['api-gateway:8080']
            labels:
              application: 'api-gateway'
              environment: 'production'
      - job_name: 'auth-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['auth-service:8081']
            labels:
              application: 'auth-service'
              environment: 'production'
      - job_name: 'product-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['product-service:8082']
            labels:
              application: 'product-service'
              environment: 'production'
      - job_name: 'order-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['order-service:8083']
            labels:
              application: 'order-service'
              environment: 'production'
      - job_name: 'notification-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['notification-service:8084']
            labels:
              application: 'notification-service'
              environment: 'production'

  tempo.yml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 24h
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        editable: true
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: Prometheus

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'Khandua Looms Microservices'
        orgId: 1
        folder: 'Observability'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards

  frontend-nginx.conf: |
    server {
      listen 80;
      server_name localhost;

      # Kubernetes CoreDNS Resolver
      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

      location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
