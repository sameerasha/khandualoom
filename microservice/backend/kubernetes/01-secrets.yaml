apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: khandualoom-micro
  labels:
    app.kubernetes.io/name: app-secrets
    app.kubernetes.io/part-of: khandualoom-platform
type: Opaque
stringData:
  # Database Credentials (Placeholders - Provide actual secrets via external secrets manager or .env.dev)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"

  # Security Signature Secret (HMAC-SHA256, minimum 256-bit key)
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_KEY_MIN_256_BITS_PLACEHOLDER_0123456789ABCDEF"

  # Email Gateway (SMTP)
  MAIL_USERNAME: "CHANGE_ME_SMTP_USERNAME"
  MAIL_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"

  # OAuth 2.0 Credentials
  GOOGLE_CLIENT_ID: "CHANGE_ME_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME_GOOGLE_CLIENT_SECRET"
  FACEBOOK_CLIENT_ID: "CHANGE_ME_FACEBOOK_CLIENT_ID"
  FACEBOOK_CLIENT_SECRET: "CHANGE_ME_FACEBOOK_CLIENT_SECRET"
  INSTAGRAM_CLIENT_ID: "CHANGE_ME_INSTAGRAM_CLIENT_ID"
  INSTAGRAM_CLIENT_SECRET: "CHANGE_ME_INSTAGRAM_CLIENT_SECRET"

  # Payment Gateway (Razorpay)
  RAZORPAY_KEY_ID: "CHANGE_ME_RAZORPAY_KEY_ID"
  RAZORPAY_KEY_SECRET: "CHANGE_ME_RAZORPAY_KEY_SECRET"

  # Observability Admin Credentials
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_GRAFANA_PASSWORD"
