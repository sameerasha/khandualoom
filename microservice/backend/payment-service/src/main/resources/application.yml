server:
  port: 8088

spring:
  config:
    import: "optional:classpath:application-common.yml"
  application:
    name: payment-service
  jpa:
    properties:
      hibernate:
        default_schema: payment_schema
  flyway:
    enabled: true
    schemas: payment_schema
    default-schema: payment_schema
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_5g2g6g4g3g2g1}
    secret: ${RAZORPAY_KEY_SECRET:secret_test_xyz123}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
