# ===================================================================
# Khandua Looms – Shared Redis 7 Configuration
# Fast-Fail Timeouts, Lettuce Connection Pooling, and Admission Datastore Settings
# ===================================================================
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 100ms
      connect-timeout: 100ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 50ms
