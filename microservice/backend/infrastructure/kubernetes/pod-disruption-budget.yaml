# ===================================================================
# Khandua Looms - Kubernetes Pod Disruption Budgets (PDB)
# Guarantees High Availability (minAvailable: 1) during node upgrades & rollouts
# ===================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: khandualoom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
