apiVersion: v1
kind: ConfigMap
metadata:
  name: khandualoom-config
  namespace: khandualoom
data:
  DB_URL: "jdbc:postgresql://postgres.khandualoom.svc.cluster.local:5432/khandualoom_db"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.khandualoom.svc.cluster.local:9092"
  REDIS_HOST: "redis.khandualoom.svc.cluster.local"
  REDIS_PORT: "6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.khandualoom.svc.cluster.local:4318/v1/traces"
  ENVIRONMENT: "production"
  TRACING_SAMPLING_PROBABILITY: "0.1"
  # Service Discovery DNS Endpoints for API Gateway routing in Kubernetes
  AUTH_SERVICE_URL: "http://auth-service.khandualoom.svc.cluster.local:8081"
  PRODUCT_SERVICE_URL: "http://product-service.khandualoom.svc.cluster.local:8082"
  ORDER_SERVICE_URL: "http://order-service.khandualoom.svc.cluster.local:8083"
  NOTIFICATION_SERVICE_URL: "http://notification-service.khandualoom.svc.cluster.local:8084"
  USER_SERVICE_URL: "http://user-service.khandualoom.svc.cluster.local:8086"
  INVENTORY_SERVICE_URL: "http://inventory-service.khandualoom.svc.cluster.local:8087"
  PAYMENT_SERVICE_URL: "http://payment-service.khandualoom.svc.cluster.local:8088"
  AUDIT_SERVICE_URL: "http://audit-service.khandualoom.svc.cluster.local:8089"
---
apiVersion: v1
kind: Secret
metadata:
  name: khandualoom-secrets
  namespace: khandualoom
type: Opaque
stringData:
  DB_USERNAME: "postgres"
  DB_PASSWORD: "change_me_in_production"
  JWT_SECRET: "khandualoom_super_secure_jwt_secret_key_at_least_256_bits_long"
  RAZORPAY_KEY_ID: "rzp_live_placeholder"
  RAZORPAY_KEY_SECRET: "rzp_secret_placeholder"
  RAZORPAY_WEBHOOK_SECRET: "rzp_webhook_placeholder"
  BREVO_API_KEY: "xkeysib-placeholder"
