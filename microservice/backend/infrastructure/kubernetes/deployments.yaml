# ===================================================================
# Khandua Looms – Production Kubernetes Deployments & Services (All 9 Microservices)
# Standards:
#  - Zero-downtime RollingUpdate (maxSurge: 1, maxUnavailable: 0)
#  - Graceful termination: terminationGracePeriodSeconds: 60
#  - Non-root container security context (UID 10001)
#  - Independent Liveness (/actuator/health/liveness) & Readiness (/actuator/health/readiness)
#  - Explicit CPU & Memory requests and limits
# ===================================================================

# -------------------------------------------------------------------
# 1. API Gateway Deployment & Service (:8080)
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: khandualoom
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: khandualoom
    app: api-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api-gateway
          image: khandualoom/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: khandualoom-config
            - secretRef:
                name: khandualoom-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: khandualoom
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: khandualoom
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
---

