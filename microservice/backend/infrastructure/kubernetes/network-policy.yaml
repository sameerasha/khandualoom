apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-microservice-isolation
  namespace: khandualoom
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - audit-service
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic ONLY from api-gateway pods or prometheus scraper
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8087
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8089
