# ===================================================================
# Khandua Looms - Enterprise PgBouncer Connection Pool Multiplexer
# Sits between microservices and PostgreSQL 16 cluster to support 10,000+ req/s
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: khandualoom
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.22.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: pgbouncer
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: khandualoom-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: khandualoom-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: POOL_MODE
              value: "transaction" # Safe for Spring Boot & Virtual Threads
            - name: MAX_CLIENT_CONN
              value: "10000"       # Supports up to 10k client connections
            - name: DEFAULT_POOL_SIZE
              value: "50"          # Physical server connection pool
            - name: MIN_POOL_SIZE
              value: "10"
            - name: RESERVE_POOL_SIZE
              value: "15"
            - name: RESERVE_POOL_TIMEOUT
              value: "5"
            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"
            - name: SERVER_CHECK_QUERY
              value: "SELECT 1"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: khandualoom
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: pgbouncer
