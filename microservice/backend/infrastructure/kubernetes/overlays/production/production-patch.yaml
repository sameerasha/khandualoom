apiVersion: v1
kind: ConfigMap
metadata:
  name: khandualoom-config
  namespace: khandualoom
data:
  ENVIRONMENT: "production"
  TRACING_SAMPLING_PROBABILITY: "0.1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: khandualoom
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: khandualoom
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: khandualoom
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: khandualoom
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: khandualoom
spec:
  replicas: 3
