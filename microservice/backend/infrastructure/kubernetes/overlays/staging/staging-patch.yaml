apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: khandualoom-ingress
  namespace: khandualoom
spec:
  tls:
    - hosts:
        - staging.khandualoom.com
        - staging-api.khandualoom.com
      secretName: khandualoom-staging-tls-cert
  rules:
    - host: staging-api.khandualoom.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    - host: staging.khandualoom.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: khandualoom-config
  namespace: khandualoom
data:
  ENVIRONMENT: "staging"
  TRACING_SAMPLING_PROBABILITY: "0.5"
