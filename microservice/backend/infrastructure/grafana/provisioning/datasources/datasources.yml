apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: 'Prometheus'
        tags: [{ key: 'service.name', value: 'application' }]
        queries:
          - name: 'Throughput'
            query: 'sum(rate(http_server_requests_seconds_count{application=~"$${__tags}"}[1m]))'
          - name: 'Latency 95th Percentile'
            query: 'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=~"$${__tags}"}[1m])) by (le))'
      serviceMap:
        datasourceUid: 'Prometheus'
