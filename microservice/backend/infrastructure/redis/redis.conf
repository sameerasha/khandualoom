# ===================================================================
# Khandua Looms – Production Redis Configuration
# Hardened for Distributed Admission Control, Caching, and Nonce Defense
# ===================================================================

# Network
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (Critical for Admission Control & Nonce Cache)
# 'noeviction' ensures that admission control keys and replay nonces are never evicted under memory pressure
maxmemory 2gb
maxmemory-policy noeviction

# Persistence: AOF (Append Only File) + RDB Snapshots
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Performance & Concurrency Tuning
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Logging
loglevel notice
