server:
  port: 8082

spring:
  config:
    import: "optional:classpath:application-common.yml"
  application:
    name: product-service
  jpa:
    properties:
      hibernate:
        default_schema: product_schema
  flyway:
    enabled: true
    schemas: product_schema
    default-schema: product_schema
    create-schemas: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  web:
    resources:
      static-locations:
        - "${FRONTEND_PUBLIC_DIR:file:./../frontend/public/}"
        - "classpath:/static/"
