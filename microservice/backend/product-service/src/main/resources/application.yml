server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5419/vastraloom_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  web:
    resources:
      static-locations:
        - "file:D:/Project/Antigravity/vastraloom/frontend/public/"
        - "classpath:/static/"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
