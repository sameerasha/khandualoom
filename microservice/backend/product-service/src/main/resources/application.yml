server:
  port: 8082

spring:
  config:
    import: "optional:classpath:application-common.yml"
  application:
    name: product-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  web:
    resources:
      static-locations:
        - "${FRONTEND_PUBLIC_DIR:file:./../frontend/public/}"
        - "classpath:/static/"
