server:
  port: 8086

spring:
  config:
    import: "optional:classpath:application-common.yml"
  application:
    name: user-service
  jpa:
    properties:
      hibernate:
        default_schema: user_schema
  flyway:
    enabled: true
    schemas: user_schema
    default-schema: user_schema
    create-schemas: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
