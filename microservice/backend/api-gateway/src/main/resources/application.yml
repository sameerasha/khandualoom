server:
  port: 8080

spring:
  config:
    import: "optional:classpath:application-common.yml"
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth & Users Route
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/auth/**, /api/users/**, /api/admin/users/**, /api/super-admin/**

        # Products & AI RAG Route
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**, /api/v1/ai/**, /api/products/**, /api/admin/products/**, /api/v1/admin/products/**, /images/**

        # Orders & Payments Route
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/orders/**, /api/v1/checkout/**, /api/v1/payments/**, /api/orders/**, /api/payment/**, /api/admin/orders/**

        # Notifications & Contacts Route
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/contact/**, /api/v1/social/**, /api/contact/**, /api/social-media/**, /api/admin/social-media/**
