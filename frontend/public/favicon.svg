<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B" />
      <stop offset="50%" stop-color="#C3A27E" />
      <stop offset="100%" stop-color="#8F6B32" />
    </linearGradient>
    <linearGradient id="gold-light" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C3A27E" />
    </linearGradient>
    
    <!-- Outer Glow Effect -->
    <filter id="luxury-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background by default -->

  <!-- Weaving Loom Threads / Diamond Background Frame -->
  <g stroke="url(#gold-gradient)" stroke-width="0.75" fill="none" opacity="0.6">
    <path d="M60 10 L110 60 L60 110 L10 60 Z" stroke-dasharray="2 3" />
    <path d="M60 20 L100 60 L60 100 L20 60 Z" />
    <line x1="10" y1="60" x2="110" y2="60" stroke-width="0.5" />
    <line x1="60" y1="10" x2="60" y2="110" stroke-width="0.5" />
  </g>

  <!-- Abstract Lotus Flower Base -->
  <g filter="url(#luxury-glow)">
    <!-- Outer Lotus Petals -->
    <path d="M60 90 C30 90 20 55 20 45 C20 30 45 45 60 25 C75 45 100 30 100 45 C100 55 90 90 60 90 Z" fill="url(#gold-gradient)" opacity="0.9" />
    
    <!-- Inner Petal Layer (Darker, to create depth) -->
    <path d="M60 85 C40 85 30 60 30 50 C30 40 50 48 60 35 C70 48 90 40 90 50 C90 60 80 85 60 85 Z" fill="#131628" opacity="0.95" />
    
    <!-- Center Core Lotus Petals -->
    <path d="M60 80 C48 80 40 62 40 55 C40 48 53 52 60 42 C67 52 80 48 80 55 C80 62 72 80 60 80 Z" fill="url(#gold-light)" />
  </g>

  <!-- Weaving Shuttle Silhouette through the Lotus -->
  <path d="M25 60 Q 60 55 95 60 Q 60 65 25 60 Z" fill="#FFF8D6" opacity="0.9" filter="url(#luxury-glow)" />
  
  <!-- Central Loom Pivot/Gem -->
  <circle cx="60" cy="60" r="3" fill="#FFFFFF" />
</svg>
