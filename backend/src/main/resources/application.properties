spring.application.name=vastraloom-api
server.port=8080

# Database Connection (PostgreSQL on Port 5419)
spring.datasource.url=jdbc:postgresql://localhost:5419/vastraloom_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations (Using a secure 256-bit key)
vastraloom.jwt.secret=9a613bf3f4d39ee8a87c1234567890abcdef1234567890abcdef1234567890abcdef
vastraloom.jwt.expiration-ms=86400000
