spring.application.name=vastraloom-api
server.port=8080
server.tomcat.max-http-form-post-size=15MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Load .env file based on active profile (defaults to dev)
spring.config.import=optional:file:.env.${spring.profiles.active:dev}[.properties]

# Database Connection
spring.datasource.url=${DB_URL:jdbc:h2:mem:vastraloom_db;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.vastraloom.api=DEBUG
logging.file.name=logs/application.log

# JWT Configurations (Using a secure 256-bit key)
vastraloom.jwt.secret=${JWT_SECRET:jwtsecrete}
vastraloom.jwt.expiration-ms=900000
vastraloom.jwt.refresh-expiration-ms=43200000

# CORS Configuration
vastraloom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Frontend URL for OAuth2 Redirects
app.frontend.url=${FRONTEND_URL:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}


# OAuth2 Client Configurations (Mock values - replace with real ones in production)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:googleclientid}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:googleclientsecret}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:facebookclientid}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:facebookclientsecret}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

spring.security.oauth2.client.registration.instagram.client-id=${INSTAGRAM_CLIENT_ID:instagramclientid}
spring.security.oauth2.client.registration.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:instagramclientsecret}
spring.security.oauth2.client.registration.instagram.scope=user_profile
spring.security.oauth2.client.registration.instagram.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.instagram.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Note: Instagram might need custom provider config if not using standard Facebook Graph API
spring.security.oauth2.client.provider.instagram.authorization-uri=https://api.instagram.com/oauth/authorize
spring.security.oauth2.client.provider.instagram.token-uri=https://api.instagram.com/oauth/access_token
spring.security.oauth2.client.provider.instagram.user-info-uri=https://graph.instagram.com/me?fields=id,username
spring.security.oauth2.client.provider.instagram.user-name-attribute=id

# Mail Server Configurations (Replace with real SMTP credentials e.g., Mailtrap, Gmail, SendGrid)
spring.mail.host=${MAIL_HOST:smtphost}
spring.mail.port=${MAIL_PORT:smtpport}
spring.mail.username=${MAIL_USERNAME:mailusername}
spring.mail.password=${MAIL_PASSWORD:mailpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
vastraloom.mail.from=${MAIL_FROM:mailfrom}

# Razorpay Payment Gateway
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummy}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy_secret}

# Super Admin Config
vastraloom.superadmin.email=${SUPER_ADMIN_EMAIL:superadmin@vastraloom.com}
vastraloom.superadmin.password=${SUPER_ADMIN_PASSWORD:superadmin123}
