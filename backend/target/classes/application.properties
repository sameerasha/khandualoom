spring.application.name=vastraloom-api
server.port=8080

# Load .env file
spring.config.import=optional:file:.env[.properties]

# Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.vastraloom.api=DEBUG
logging.file.name=logs/application.log

# JWT Configurations (Using a secure 256-bit key)
vastraloom.jwt.secret=${JWT_SECRET}
vastraloom.jwt.expiration-ms=86400000

# CORS Configuration
vastraloom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# OAuth2 Client Configurations (Mock values - replace with real ones in production)
spring.security.oauth2.client.registration.google.client-id=mock-google-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-google-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.facebook.client-id=mock-facebook-client-id
spring.security.oauth2.client.registration.facebook.client-secret=mock-facebook-client-secret
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

spring.security.oauth2.client.registration.instagram.client-id=mock-instagram-client-id
spring.security.oauth2.client.registration.instagram.client-secret=mock-instagram-client-secret
spring.security.oauth2.client.registration.instagram.scope=user_profile
spring.security.oauth2.client.registration.instagram.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.instagram.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Note: Instagram might need custom provider config if not using standard Facebook Graph API
spring.security.oauth2.client.provider.instagram.authorization-uri=https://api.instagram.com/oauth/authorize
spring.security.oauth2.client.provider.instagram.token-uri=https://api.instagram.com/oauth/access_token
spring.security.oauth2.client.provider.instagram.user-info-uri=https://graph.instagram.com/me?fields=id,username
spring.security.oauth2.client.provider.instagram.user-name-attribute=id

# Mail Server Configurations (Replace with real SMTP credentials e.g., Mailtrap, Gmail, SendGrid)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username:vastraloom-alerts@example.com
